# New diagnostic configuration; historical screening/pilot configs remain unchanged.
namespace: streamarena-followup
models:
  perception: &common
    kind: chat
    model: google/gemini-3.8-flash
    revision: openrouter-2026-09-20
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    json_mode: true
    max_output_tokens: 4096
    image_token_reserve: 4096
    timeout_s: 40
    max_retries: 0
    temperature: 0
    expected_provider_names: [Google AI Studio]
    prices: {input_per_million: 0.375, output_per_million: 1.875, cached_input_per_million: 0.0375}
    extra_body:
      service_tier: flex
      reasoning: {effort: low}
      provider:
        only: [google-ai-studio/flex]
        allow_fallbacks: false
        require_parameters: true
  glm:
    <<: *common
    model: z-ai/glm-5.3-flash
    expected_provider_names: [Z.AI, Fireworks, Novita, Sail Research, Together, Modal]
    # Highest listed rates in this allowlist, for conservative admission only.
    prices: {input_per_million: 0.45, output_per_million: 1.5, cached_input_per_million: 0.09}
    extra_body:
      reasoning: {effort: low}
      provider:
        order: [z-ai/fp8, fireworks, novita/fp8, sail-research/fp8, together, modal/fp8]
        only: [z-ai/fp8, fireworks, novita/fp8, sail-research/fp8, together, modal/fp8]
        allow_fallbacks: true
        require_parameters: true
budget:
  max_requests: 60
  max_usd: 1.0
