# One self-hosted Qwen checkpoint, two per-request thinking profiles; no Sol required.
# Local L40S action latency is qualified; full-loop speed/overworld are not. See docs/INTERACTIVE.md.
source: game
goal: >-
  Play the game from its current state and make progress toward defeating its
  first two Gym Leaders. Use only the available visual observations and controls.
  Learn places, dialogue and useful mechanics as evidence-backed beliefs.
backend: chat
endpoints:
  fast: &qwen
    base_url: http://127.0.0.1:8000/v1
    model: Qwen/Qwen3.8-27B-FP8
    billing: local
    timeout_s: 90
    max_output_tokens: 4096
    response_format: json_object
    extra_body:
      temperature: 0.7
      top_p: 0.8
      top_k: 20
      min_p: 0
      presence_penalty: 1.5
      repetition_penalty: 1
      seed: 0
      chat_template_kwargs: {enable_thinking: false}
  plan:
    <<: *qwen
    reasoning_effort: medium
    extra_body:
      temperature: 1
      top_p: 0.95
      top_k: 20
      min_p: 0
      presence_penalty: 0
      repetition_penalty: 1
      seed: 0
      chat_template_kwargs: {enable_thinking: true, preserve_thinking: true}
roles: {extract: fast, plan: plan, act: fast, compile: plan}
role_output_limits: {extract: 4096, plan: 4096, act: 64, compile: 4096}
max_steps: 10
max_calls: 40
max_estimated_usd: 5
wall_limit_s: 900
history_frames: 2
max_context_chars: 16000
max_entities_in_context: 40
max_images: 3
view_scale: 3
plan_every: 8
compile_at_start: false
baseline: world
timing: stepped
# Menu DOWN/UP/A tested at 4+24; other controls still need qualification.
# WAIT advances time without pressing a key, including during delayed transitions.
actions:
  - {id: UP, button: up, press_frames: 4, release_frames: 24}
  - {id: DOWN, button: down, press_frames: 4, release_frames: 24}
  - {id: LEFT, button: left, press_frames: 4, release_frames: 24}
  - {id: RIGHT, button: right, press_frames: 4, release_frames: 24}
  - {id: A, button: a, press_frames: 4, release_frames: 24}
  - {id: B, button: b, press_frames: 4, release_frames: 24}
  - {id: START, button: start, press_frames: 4, release_frames: 24}
  - {id: SELECT, button: select, press_frames: 4, release_frames: 24}
  - {id: WAIT, button: wait, press_frames: 24, release_frames: 24}
