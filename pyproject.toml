[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "streambudget"
version = "0.1.0"
description = "Evidence-preserving video observation and pixels-only state/action runtime"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["httpx>=0.27,<1", "pydantic>=2.9,<3", "PyYAML>=6,<7", "Pillow>=11,<13", "numpy>=1.26,<3"]

[project.optional-dependencies]
gameboy = ["pyboy>=2.3,<3"]
ocr = ["rapidocr==3.9.2", "onnxruntime==1.24.4"]
video = ["av>=14,<18"]
server = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.9,<1"]

[project.scripts]
streambudget = "streambudget.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
